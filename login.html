<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · MediCare Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18M3 12h18"/></svg></div>
      <div class="brand-name">MediCare Plus</div>
    </div>
    <div class="brand-sub">Hospital Information System Login</div>

    <div class="role-picker" id="rolePicker">
      <button class="role-btn active" data-role="Patient" data-href="dashboard.html">Patient</button>
      <button class="role-btn" data-role="Doctor" data-href="doctor-dashboard.html">Doctor</button>
      <button class="role-btn" data-role="Nurse" data-href="nurse-dashboard.html">Nurse</button>
      <button class="role-btn" data-role="Admin" data-href="admin-dashboard.html">Admin</button>
    </div>

    <div class="field">
      <label>Email address</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input type="text" id="emailInput" value="invalid-email@medplus" class="err">
      </div>
      <div class="err-msg" id="emailErr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        Please enter a valid email address
      </div>
    </div>

    <div class="field" style="margin-bottom:6px;">
      <label>Password</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
        <input type="password" value="passw0rd123">
      </div>
    </div>

    <div class="row-between">
      <label><input type="checkbox" checked> Remember me</label>
      <a class="link-teal" href="#">Forgot password?</a>
    </div>

    <button class="btn-primary" id="signInBtn">Sign In to Portal</button>
    <div class="foot-note">New patient here? <a class="link-teal" href="#">Register Now</a></div>
  </div>
</div>
<script>
let selectedHref = "dashboard.html";
document.querySelectorAll('.role-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedHref = btn.dataset.href;
  });
});
const emailInput = document.getElementById('emailInput');
const emailErr = document.getElementById('emailErr');
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
emailInput.addEventListener('input', () => {
  const ok = validEmail(emailInput.value);
  emailInput.classList.toggle('err', !ok);
  emailErr.classList.toggle('hidden', ok);
});
document.getElementById('signInBtn').addEventListener('click', () => {
  if(!validEmail(emailInput.value)){
    emailInput.classList.add('err');
    emailErr.classList.remove('hidden');
    emailInput.focus();
    return;
  }
  window.location.href = selectedHref;
});
</script>
</body>
</html>
